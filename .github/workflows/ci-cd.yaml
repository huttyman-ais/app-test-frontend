name: CI/CD - frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Naming convention (must match terraform-modules outputs used by the -infra repo):
#   resource group   : rg-app-test-dev
#   ACR              : acrapp-testdev (alphanumeric only)
#   container app env: cae-app-test-dev
#   this container app: app-test-frontend
env:
  APP_NAME: app-test
  ENVIRONMENT: dev
  RESOURCE_GROUP: rg-app-test-dev
  ACR_NAME: acrapp-testdev
  CONTAINER_APP_NAME: app-test-frontend
  IMAGE_NAME: app-test-frontend

permissions:
  id-token: write # required for OIDC login to Azure
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 
          tenant-id: 
          subscription-id: 

      - name: ACR login
        run: az acr login --name 

      - name: Resolve backend API URL
        id: api
        run: |
          FQDN=$(az containerapp show \
            --name "-backend" \
            --resource-group "" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE=".azurecr.io/:"
          docker build \
            --build-arg VITE_API_URL="" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name  \
            --resource-group  \
            --image "$IMAGE"

      - name: Summary
        run: |
          FQDN=$(az containerapp show --name  \
            --resource-group  \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend URL: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
